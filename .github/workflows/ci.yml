name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Publish coverage summary
        if: always() && hashFiles('target/site/jacoco/jacoco.csv') != ''
        run: |
          awk -F, '
            function pct(covered, missed) {
              return covered + missed == 0 ? "n/a" : sprintf("%.1f%%", 100 * covered / (covered + missed))
            }
            NR > 1 { im += $4; ic += $5; bm += $6; bc += $7; lm += $8; lc += $9 }
            END {
              print "## Test coverage"
              print ""
              print "| Metric | Coverage |"
              print "|---|---|"
              print "| Instructions | " pct(ic, im) " |"
              print "| Branches | " pct(bc, bm) " |"
              print "| Lines | " pct(lc, lm) " |"
            }
          ' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('target/site/jacoco/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco/
